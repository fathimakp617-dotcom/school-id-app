services:
  - type: web
    name: schoolid-app
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: schoolid-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: SCHOOLID_ADMIN_EMAIL
        sync: false
      - key: SCHOOLID_ADMIN_PASSWORD
        sync: false
      - key: SCHOOLID_STAFF_EMAIL
        value: staff@schoolid.app
      - key: SCHOOLID_STAFF_PASSWORD
        sync: false
      - key: SCHOOLID_STAFF_CLASS
        value: SA1
      - key: SCHOOLID_PARENT_EMAIL
        value: parent@schoolid.app
      - key: SCHOOLID_PARENT_PASSWORD
        sync: false
      - key: SCHOOLID_PARENT_STUDENT_ID
        value: S006
      - key: SCHOOLID_RFID_DEVICE_KEY
        sync: false

databases:
  - name: schoolid-db
    databaseName: schoolid
    user: schoolid
    postgresMajorVersion: "17"
    region: singapore
    plan: free
