services:
  - type: web
    name: schoolid-app-second
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: schoolid-db
          property: connectionString
      - key: SCHOOLID_DATA_NAMESPACE
        value: schoolid_second
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: SCHOOLID_ADMIN_EMAIL
        value: admin@schoolid-second.app
      - key: SCHOOLID_ADMIN_PASSWORD
        generateValue: true
      - key: SCHOOLID_STAFF_EMAIL
        value: staff@schoolid-second.app
      - key: SCHOOLID_STAFF_PASSWORD
        generateValue: true
      - key: SCHOOLID_STAFF_CLASS
        value: SA1
      - key: SCHOOLID_PARENT_EMAIL
        value: parent@schoolid-second.app
      - key: SCHOOLID_PARENT_PASSWORD
        generateValue: true
      - key: SCHOOLID_PARENT_STUDENT_ID
        value: S001
      - key: SCHOOLID_RFID_DEVICE_KEY
        generateValue: true
